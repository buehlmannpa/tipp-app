      <g fill="#d22730">
        <rect y="0" width="96" height="8"/><rect y="16" width="96" height="9"/>
        <rect y="33" width="96" height="9"/><rect y="50" width="96" height="8"/>
      </g>
      <rect width="44" height="30" fill="#2a4d9c"/>
    </g>
  </g>

  <!-- Flaggenreihe 2: POR JPN ITA NED SUI -->
  <g transform="translate(0,796)">
    <!-- POR -->
    <g transform="translate(244,0)">
      <rect width="92" height="56" fill="#d22730"/>
      <rect width="36" height="56" fill="#1a9850"/>
