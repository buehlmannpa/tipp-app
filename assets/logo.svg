      <rect x="31" width="31" height="56" fill="#ffffff"/>
      <rect x="62" width="30" height="56" fill="#d22730"/>
    </g>
    <!-- NED -->
    <g transform="translate(556,0)">
      <rect width="92" height="56" fill="#d22730"/>
      <rect y="19" width="92" height="19" fill="#ffffff"/>
      <rect y="38" width="92" height="18" fill="#2a4d9c"/>
