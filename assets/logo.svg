        lengthAdjust="spacingAndGlyphs">TIPPSPIEL</text>

  <!-- Flaggenreihe 1: BRA GER ARG FRA ENG USA -->
  <g transform="translate(0,724)">
    <!-- BRA -->
    <g transform="translate(178,0)">
      <rect width="96" height="58" fill="#1a9850"/>
      <polygon points="48,7 86,29 48,51 10,29" fill="#f2c41d"/>
      <circle cx="48" cy="29" r="11" fill="#2a4d9c"/>
    </g>
    <!-- GER -->
    <g transform="translate(286,0)">
      <rect width="96" height="58" fill="#000000"/>
      <rect y="19" width="96" height="20" fill="#d22730"/>
      <rect y="39" width="96" height="19" fill="#f2c41d"/>
    </g>
    <!-- ARG -->
    <g transform="translate(394,0)">
      <rect width="96" height="58" fill="#7fb8e6"/>
      <rect y="19" width="96" height="20" fill="#ffffff"/>
      <circle cx="48" cy="29" r="7" fill="#f2c41d"/>
    </g>
    <!-- FRA -->
    <g transform="translate(502,0)">
