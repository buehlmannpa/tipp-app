<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline – WM Tippspiel 2026</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f2f2f7;
      color: #000;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #fff; }
      p { color: #98989f; }
    }
    .ball { font-size: 56px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { font-size: 15px; color: #6e6e73; line-height: 1.5; margin: 0 0 20px; }
    button {
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: #007aff;
      border: 0;
      border-radius: 12px;
      padding: 12px 28px;
    }
  </style>
</head>
<body>
  <div>
    <div class="ball">⚽️</div>
    <h1>Keine Verbindung</h1>
    <p>Für Tipps, Resultate und Ranglisten braucht die App Internet.<br />Versuch es gleich nochmal.</p>
    <button onclick="location.reload()">Erneut laden</button>
  </div>
</body>
</html>
